<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotram Plus — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 40px 32px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #f59e0b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button {
      width: 100%;
      padding: 12px 16px;
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.99); }
    .hint { font-size: 12px; color: #6b7280; margin-top: 16px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Connexion impossible</h1>
    <p>
      Le serveur Cotram Plus est injoignable.<br />
      Vérifiez votre connexion Internet puis réessayez.
    </p>
    <button id="retry">Réessayer</button>
    <p class="hint">L'application nécessite une connexion Internet.</p>
  </div>
  <script>
    document.getElementById("retry").addEventListener("click", () => {
      if (window.cotram?.retry) {
        window.cotram.retry();
      } else {
        location.reload();
      }
    });
  </script>
</body>
</html>
